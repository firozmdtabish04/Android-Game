<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="45%" stop-color="#FB8C00"/>
      <stop offset="70%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#skyGrad)"/>
  
  <!-- Setting Sun -->
  <circle cx="256" cy="220" r="70" fill="#FFF9C4" opacity="0.9"/>
  <circle cx="256" cy="220" r="100" fill="#FFE082" opacity="0.4"/>
  
  <!-- Distant Trees & Village Silhouette -->
  <path d="M 0 310 Q 70 285 130 305 Q 200 280 256 300 Q 320 285 390 305 Q 460 280 512 310 L 512 512 L 0 512 Z" fill="#3E2723" opacity="0.4"/>
  
  <!-- Earthen Desi Mud Road (Three-lane perspective) -->
  <polygon points="210,310 302,310 460,512 52,512" fill="url(#roadGrad)"/>
  
  <!-- Lane Markers -->
  <line x1="240" y1="310" x2="190" y2="512" stroke="#FFF" stroke-width="4" stroke-dasharray="14 10" opacity="0.6"/>
  <line x1="272" y1="310" x2="322" y2="512" stroke="#FFF" stroke-width="4" stroke-dasharray="14 10" opacity="0.6"/>

  <!-- Golden Rupee Coin on Right -->
  <circle cx="360" cy="380" r="32" fill="#FFD700" stroke="#B8860B" stroke-width="4"/>
  <text x="360" y="394" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#8B6508" text-anchor="middle">₹</text>

  <!-- Runner Silhouette -->
  <g fill="#FFF" transform="translate(225, 330) scale(0.9)">
    <circle cx="20" cy="12" r="10"/>
    <path d="M 12 25 L 28 25 L 24 50 L 16 50 Z"/>
    <!-- Running limbs -->
    <path d="M 14 30 L 0 45 L -8 40" stroke="#FFF" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 26 30 L 40 42 L 50 36" stroke="#FFF" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 17 50 L 8 72 L -5 70" stroke="#FFF" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 23 50 L 34 68 L 48 80" stroke="#FFF" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Gamchha scarf waving in the wind -->
    <path d="M 16 26 Q 5 20 -8 24 Q -16 18 -26 22" stroke="#D32F2F" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Game Title Banner -->
  <rect x="56" y="44" width="400" height="74" rx="20" fill="#212121" opacity="0.85"/>
  <text x="256" y="92" font-family="'Trebuchet MS', Impact, sans-serif" font-weight="900" font-size="44" fill="#FFB300" text-anchor="middle" letter-spacing="3">MITTI RUN</text>
  <text x="256" y="112" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#FFF" text-anchor="middle" letter-spacing="2">A DESI ENDLESS ADVENTURE</text>
</svg>
